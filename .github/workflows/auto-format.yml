name: auto-format

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]

env:
  GH_TOKEN: ${{ github.token }}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auto-format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - name: git config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: autoformat
          dependencies: "hard"

      - name: render README.Rmd
        shell: Rscript {0}
        run: |
          rmarkdown::render("README.Rmd")

      - name: update CITATION.cff
        shell: Rscript {0}
        run: |
          # Customize with your own code
          # See https://docs.ropensci.org/cffr/articles/cffr.html
          # Write your own keys
          mykeys <- list()
          # Create your CITATION.cff file
          cffr::cff_write(keys = mykeys)

      - name: Document
        shell: Rscript {0}
        run: roxygen2::roxygenize()

      - name: commit & push
        run: |
          git add .
          git commit -m "ci: 🤖 auto-format" || echo "nothing to commit"
          git push || echo "nothing to push"
